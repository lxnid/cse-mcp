<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- cse-mcp icon: rising candlesticks + trend arrow, in Sri Lankan flag colours. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A41C47"/>
      <stop offset="1" stop-color="#4A0A20"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#EB7400"/>
      <stop offset="1" stop-color="#FFC93C"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4">
    <line x1="64" y1="160" x2="448" y2="160"/>
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="64" y1="352" x2="448" y2="352"/>
  </g>

  <!-- candlesticks: wick + body -->
  <g stroke-linecap="round">
    <line x1="132" y1="292" x2="132" y2="420" stroke="#FFFFFF" stroke-width="10"/>
    <rect x="106" y="316" width="52" height="80" rx="10" fill="#FFFFFF"/>

    <line x1="212" y1="258" x2="212" y2="372" stroke="#EB7400" stroke-width="10"/>
    <rect x="186" y="276" width="52" height="72" rx="10" fill="#EB7400"/>

    <line x1="292" y1="196" x2="292" y2="338" stroke="#FFFFFF" stroke-width="10"/>
    <rect x="266" y="218" width="52" height="96" rx="10" fill="#FFFFFF"/>

    <line x1="372" y1="152" x2="372" y2="300" stroke="#2BC4A4" stroke-width="10"/>
    <rect x="346" y="172" width="52" height="108" rx="10" fill="#2BC4A4"/>
  </g>

  <!-- trend arrow -->
  <polyline points="84,370 176,286 250,316 352,196 404,142"
            fill="none" stroke="#4A0A20" stroke-opacity="0.55" stroke-width="40"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="84,370 176,286 250,316 352,196 404,142"
            fill="none" stroke="url(#arrow)" stroke-width="24"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="442,100 444,190 356,104" fill="#FFC93C" stroke="#FFC93C" stroke-width="10" stroke-linejoin="round"/>
</svg>
